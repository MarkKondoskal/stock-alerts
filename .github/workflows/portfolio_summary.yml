name: Marks Portfolio Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'STATUS'
        type: choice
        options:
          - STATUS
          - BUY
          - SELL
      ticker:
        description: 'Stock Ticker (Leave empty for STATUS)'
        required: false
        default: ''
      shares:
        description: 'Number of Shares (Leave empty for STATUS)'
        required: false
        default: ''
      price:
        description: 'Price per Share (Leave empty for STATUS)'
        required: false
        default: ''

jobs:
  manage-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify private repository is configured
        env:
          DATA_REPOSITORY: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          GH_TOKEN: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
        run: |
          test -n "$DATA_REPOSITORY" && test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPOSITORY" --jq .private)" = true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout private portfolio repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          ref: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
          token: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
          path: _private
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib requests

      - name: Execute Portfolio Action
        env:
          LEGACY_PORTFOLIO_FILE: _private/portfolio/marks_portfolio.json
          DISCORD_PORTFOLIO_WEBHOOK: ${{ secrets.DISCORD_PORTFOLIO_WEBHOOK }}
          ACTION: ${{ inputs.action }}
          TICKER: ${{ inputs.ticker }}
          SHARES: ${{ inputs.shares }}
          PRICE: ${{ inputs.price }}
        run: |
          if [ "$ACTION" = "STATUS" ]; then
            python portfolio/marks_portfolio_update.py STATUS
          else
            python portfolio/marks_portfolio_update.py "$ACTION" "$TICKER" "$SHARES" "$PRICE"
          fi

      - name: Auto-commit portfolio changes to the private repository
        if: inputs.action != 'STATUS'
        working-directory: _private
        env:
          DATA_BRANCH: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portfolio/marks_portfolio.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update private legacy portfolio'
            git push origin "HEAD:$DATA_BRANCH"
          fi

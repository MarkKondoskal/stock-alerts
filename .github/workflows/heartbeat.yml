name: US Market Open Heartbeat

on:
  schedule:
    - cron: '30 9 * * 1-5'
      timezone: "America/New_York"

jobs:
  send-heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Heartbeat Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PORTFOLIO_TEST_WEBHOOK }}
        run: python alerts/heartbeat.py

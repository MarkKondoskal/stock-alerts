name: US Economic Data Monitor

on:
  schedule:
    # Runs hourly, Monday–Friday. Hourly (not a single daily run) so it catches
    # 08:30 ET data releases, the weekly jobless claims, and FOMC statements
    # (14:00 ET). The bot only alerts when a value actually changes.
    - cron: '0 * * * 1-5'
  workflow_dispatch:  # allows manual testing

jobs:
  check-econ-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run economic data monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Reuse the sentiment webhook for economic alerts
          DISCORD_ECONOMIC_WEBHOOK: ${{ secrets.DISCORD_SENTIMENT_WEBHOOK }}
        run: |
          python alerts/economic_alert.py

      - name: Commit & push state updates
        run: bash .github/scripts/commit_and_push.sh "Update economic data state" alerts/economic_state.json

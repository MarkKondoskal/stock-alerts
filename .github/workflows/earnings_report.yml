name: Portfolio Earnings Report

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "What earnings report should be generated?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - today

  schedule:
    - cron: '0 * * * *'

# Runs hourly on purpose: results are published at different times, and the script
# only posts once the reported EPS is available. earnings_state.json stops a report
# from being re-posted on every later run that day.

jobs:
  earnings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify private repository is configured
        env:
          DATA_REPOSITORY: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          GH_TOKEN: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
        run: |
          test -n "$DATA_REPOSITORY" && test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPOSITORY" --jq .private)" = true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout private portfolio repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          ref: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
          token: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
          path: _private
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Earnings Report
        env:
          LEGACY_PORTFOLIO_FILE: _private/portfolio/marks_portfolio.json
          DISCORD_PORTFOLIO_WEBHOOK: ${{ secrets.DISCORD_PORTFOLIO_WEBHOOK }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || 'today' }}
          PYTHONUNBUFFERED: 1    # <--- forces unbuffered output
        run: |
          echo "=== WORKFLOW START ==="
          python -u portfolio/earnings_report.py
          echo "=== WORKFLOW END ==="

      - name: Commit & push earnings state
        run: bash .github/scripts/commit_and_push.sh "Update earnings report state" portfolio/earnings_state.json

name: Portfolio Earnings Report

on:
  workflow_dispatch:          # allows manual trigger
  schedule:
    - cron: '0 14 * * *'      # optional: runs daily at 14:00 UTC (adjust as needed)

jobs:
  earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Earnings Report
        env:
          DISCORD_PORTFOLIO_WEBHOOK: ${{ secrets.DISCORD_PORTFOLIO_WEBHOOK }}
        run: |
          python portfolio/earnings_report.py

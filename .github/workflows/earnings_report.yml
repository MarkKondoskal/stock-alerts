name: Portfolio Earnings Report

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "What earnings report should be generated?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - today

  schedule:
    - cron: '0 * * * *'

jobs:
  earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Earnings Report
        env:
          DISCORD_PORTFOLIO_WEBHOOK: ${{ secrets.DISCORD_PORTFOLIO_WEBHOOK }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || 'today' }}
        run: |
          python portfolio/earnings_report.py

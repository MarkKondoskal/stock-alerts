name: Stock Price Monitor

on:
  schedule:
    # Runs every 15 minutes during US market hours (Mon-Fri)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing file updates back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests yfinance

      - name: Run Stock Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_alert.py

      - name: Commit Updated Watchlist back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add watchlist.json && git commit -m "Auto-removed triggered price targets" && git push)

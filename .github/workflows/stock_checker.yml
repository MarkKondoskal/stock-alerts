name: Stock & Sentiment Alert Pipeline

on:
  schedule:
    # Runs every 15 minutes during US trading hours (Mon-Fri)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  run-alert-monitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests yfinance fear-greed

      - name: Run Stock Alerter Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK }}
        run: python stock_alert.py

      - name: Run Market Sentiment Script
        env:
          DISCORD_SENTIMENT_WEBHOOK: ${{ secrets.DISCORD_SENTIMENT_WEBHOOK }}
        run: python sentiment_alert.py

      - name: Commit Watchlist Updates Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add watchlist.json && git commit -m "Auto-removed triggered price targets" && git push)

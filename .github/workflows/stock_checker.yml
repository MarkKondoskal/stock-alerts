name: Stock & Sentiment Alert Pipeline

on:
  schedule:
    # Runs every 15 minutes, 07:00–21:59 UTC, Mon-Fri (covers EU & US markets)
    - cron: '*/15 7-21 * * 1-5' 
  workflow_dispatch:

# Both workflows can edit alerts/watchlist.json. Run only one at a time.
concurrency:
  group: stock-alerts-watchlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-alert-monitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests yfinance   # removed unused 'fear-greed'

      # --- 1. STOCK ALERTER ---
      - name: Run Stock Alerter Script
        env:
          DISCORD_STOCK_WEBHOOK: ${{ secrets.DISCORD_STOCK_WEBHOOK }}
        run: python alerts/stock_alert.py

      # --- 2. MARKET SENTIMENT ---
      - name: Run Market Sentiment Script
        env:
          DISCORD_SENTIMENT_WEBHOOK: ${{ secrets.DISCORD_SENTIMENT_WEBHOOK }}
        run: python alerts/sentiment_alert.py

      # --- 3. AUTO-COMMIT UPDATES ---
      - name: Auto-commit Watchlist & Sentiment State
        run: bash .github/scripts/commit_and_push.sh "Auto-updated price targets and sentiment state" alerts/watchlist.json alerts/sentiment_state.json

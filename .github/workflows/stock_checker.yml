name: Stock & Sentiment Alert Pipeline

on:
  schedule:
    # Runs every 15 minutes, 07:00–21:59 UTC, Mon-Fri (covers EU & US markets)
    - cron: '*/15 7-21 * * 1-5' 
  workflow_dispatch:

# Both workflows can edit alerts/watchlist.json. Run only one at a time.
concurrency:
  group: stock-alerts-private-watchlist
  cancel-in-progress: false

jobs:
  run-alert-monitors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Verify private data repository
        env:
          DATA_REPOSITORY: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          GH_TOKEN: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
        run: |
          test -n "$DATA_REPOSITORY"
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPOSITORY" --jq .private)" = true

      - name: Checkout private watchlist
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          ref: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
          token: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
          path: _private

      - name: Check private watchlist exists
        run: test -f _private/alerts/watchlist.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests yfinance   # removed unused 'fear-greed'

      # --- 1. STOCK ALERTER ---
      - name: Run Stock Alerter Script
        id: stock_quotes
        continue-on-error: true
        env:
          STOCKALERTS_WATCHLIST_FILE: _private/alerts/watchlist.json
          DISCORD_STOCK_WEBHOOK: ${{ secrets.DISCORD_STOCK_WEBHOOK }}
        run: python alerts/stock_alert.py

      - name: Commit triggered target removals to private repository
        env:
          STOCKALERTS_PRIVATE_CHECKOUT: _private
          STOCKALERTS_DATA_REPOSITORY: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          STOCKALERTS_DATA_BRANCH: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
          STOCKALERTS_DATA_TOKEN: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
        run: python alerts/publish_watchlist.py

      # --- 2. MARKET SENTIMENT ---
      - name: Run Market Sentiment Script
        env:
          DISCORD_SENTIMENT_WEBHOOK: ${{ secrets.DISCORD_SENTIMENT_WEBHOOK }}
        run: python alerts/sentiment_alert.py

      # --- 3. AUTO-COMMIT UPDATES ---
      - name: Auto-commit Sentiment State
        run: bash .github/scripts/commit_and_push.sh "Auto-update sentiment state" alerts/sentiment_state.json

      - name: Report quote refresh failure
        if: steps.stock_quotes.outcome == 'failure'
        run: exit 1

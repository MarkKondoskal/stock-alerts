name: Watchlist Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'ADD'
        type: choice
        options:
          - ADD
          - REMOVE
          - REMOVE_ALL
          - LIST
          - STATUS
      ticker:
        description: 'Ticker symbol (e.g., MA)'
        required: false
        default: ''
      target:
        description: 'Target price or valuation multiple (e.g., 35 for 35x)'
        required: false
        default: ''
      direction:
        description: 'Valuation direction: TRIM (multiple at/above target) or BUY (multiple at/below target)'
        required: true
        default: 'TRIM'
        type: choice
        options:
          - TRIM
          - BUY
      metric:
        description: 'Metric for ADD/REMOVE'
        required: true
        default: 'PRICE'
        type: choice
        options:
          - PRICE
          - FxPE
          - PE
          - P/S

# Both workflows can edit alerts/watchlist.json. Run only one at a time.
concurrency:
  group: stock-alerts-private-watchlist
  cancel-in-progress: false

jobs:
  manage-watchlist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify private data repository
        env:
          DATA_REPOSITORY: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          GH_TOKEN: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
        run: |
          test -n "$DATA_REPOSITORY"
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPOSITORY" --jq .private)" = true

      - name: Checkout private watchlist
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STOCKALERTS_DATA_REPOSITORY }}
          ref: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
          token: ${{ secrets.STOCKALERTS_DATA_TOKEN }}
          path: _private

      - name: Check private watchlist exists
        run: test -f _private/alerts/watchlist.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run watchlist manager
        env:
          ACTION: ${{ github.event.inputs.action }}
          TICKER: ${{ github.event.inputs.ticker }}
          TARGET: ${{ github.event.inputs.target }}
          METRIC: ${{ github.event.inputs.metric }}
          DIRECTION: ${{ github.event.inputs.direction }}
          STOCKALERTS_WATCHLIST_FILE: _private/alerts/watchlist.json
          DISCORD_STOCK_WEBHOOK: ${{ secrets.DISCORD_STOCK_WEBHOOK }}
        run: python alerts/watchlist_manager.py "$ACTION" "$TICKER" "$TARGET" "$METRIC" "$DIRECTION"

      - name: Commit & push changes
        if: github.event.inputs.action != 'LIST' && github.event.inputs.action != 'STATUS'
        working-directory: _private
        env:
          STOCKALERTS_PUSH_BRANCH: ${{ vars.STOCKALERTS_DATA_BRANCH || 'main' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/commit_and_push.sh" "Update private watchlist" alerts/watchlist.json

name: Watchlist Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'ADD'
        type: choice
        options:
          - ADD
          - REMOVE
          - REMOVE_ALL
          - LIST
          - STATUS
      ticker:
        description: 'Ticker symbol (e.g., MA)'
        required: false
        default: ''
      target:
        description: 'Target price or valuation multiple (e.g., 35 for 35x)'
        required: false
        default: ''
      direction:
        description: 'Valuation direction: TRIM (multiple at/above target) or BUY (multiple at/below target)'
        required: true
        default: 'TRIM'
        type: choice
        options:
          - TRIM
          - BUY
      metric:
        description: 'Metric for ADD/REMOVE'
        required: true
        default: 'PRICE'
        type: choice
        options:
          - PRICE
          - FxPE
          - PE
          - P/S

# Both workflows can edit alerts/watchlist.json. Run only one at a time.
concurrency:
  group: stock-alerts-watchlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manage-watchlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run watchlist manager
        env:
          ACTION: ${{ github.event.inputs.action }}
          TICKER: ${{ github.event.inputs.ticker }}
          TARGET: ${{ github.event.inputs.target }}
          METRIC: ${{ github.event.inputs.metric }}
          DIRECTION: ${{ github.event.inputs.direction }}
          DISCORD_STOCK_WEBHOOK: ${{ secrets.DISCORD_STOCK_WEBHOOK }}
        run: python alerts/watchlist_manager.py "$ACTION" "$TICKER" "$TARGET" "$METRIC" "$DIRECTION"

      - name: Commit & push changes
        if: github.event.inputs.action != 'LIST' && github.event.inputs.action != 'STATUS'
        env:
          COMMIT_MSG: "Update watchlist: ${{ github.event.inputs.action }} ${{ github.event.inputs.ticker }}"
        run: bash .github/scripts/commit_and_push.sh "$COMMIT_MSG" alerts/watchlist.json
